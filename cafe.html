<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café | Pâtisserie Syrienne</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&amp;family=Inter:wght@400;500&amp;display=swap');
        .tailwind-ready { font-family: 'Inter', system_ui, sans-serif; }
        .heading-font { font-family: 'Playfair Display', sans-serif; }
    </style>
</head>
<body class="tailwind-ready bg-stone-50">
    <div class="max-w-7xl mx-auto px-6 py-12">
        <a href="index.html" class="inline-flex items-center gap-2 mb-10 text-amber-700 hover:text-amber-800 font-medium">← Retour</a>
        <h1 class="heading-font text-5xl font-bold text-center mb-12">Nos Cafés & Boissons Chaudes</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- 10 exemples -->
            <div class="bg-white rounded-3xl overflow-hidden shadow card-hover"><img src="image/syrienne.jpeg" class="w-full h-56 object-cover"><div class="p-6"><h3 class="font-semibold text-xl">Café syrienne</h3><p class="text-3xl font-bold text-amber-700 mt-6">3,50 $</p></div></div>
            <div class="bg-white rounded-3xl overflow-hidden shadow card-hover"><img src="image/allonge.jpeg" class="w-full h-56 object-cover"><div class="p-6"><h3 class="font-semibold text-xl">Café allongée</h3><p class="text-3xl font-bold text-amber-700 mt-6">3,50 $</p></div></div>
            <div class="bg-white rounded-3xl overflow-hidden shadow card-hover"><img src="image/latte.jpeg" class="w-full h-56 object-cover"><div class="p-6"><h3 class="font-semibold text-xl">Café Latté</h3><p class="text-3xl font-bold text-amber-700 mt-6">4 $</p></div></div>
            <div class="bg-white rounded-3xl overflow-hidden shadow card-hover"><img src="image/glace.jpeg" class="w-full h-56 object-cover"><div class="p-6"><h3 class="font-semibold text-xl">Café Glacé</h3><p class="text-3xl font-bold text-amber-700 mt-6">4,50 $</p></div></div>
            <div class="bg-white rounded-3xl overflow-hidden shadow card-hover"><img src="image/cappuccino.jpeg" class="w-full h-56 object-cover"><div class="p-6"><h3 class="font-semibold text-xl">Cappuccino</h3><p class="text-3xl font-bold text-amber-700 mt-6">4 $</p></div></div>
            <div class="bg-white rounded-3xl overflow-hidden shadow card-hover"><img src="image/expresso.jpeg" class="w-full h-56 object-cover"><div class="p-6"><h3 class="font-semibold text-xl">Expresso</h3><p class="text-3xl font-bold text-amber-700 mt-6">2,50 $</p></div></div>
            <div class="bg-white rounded-3xl overflow-hidden shadow card-hover"><img src="image/americano.jpeg" class="w-full h-56 object-cover"><div class="p-6"><h3 class="font-semibold text-xl">Americano</h3><p class="text-3xl font-bold text-amber-700 mt-6">3,50 $</p></div></div>
        </div>
    </div>
</body>
</html>
